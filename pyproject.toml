[project]
name = "fizzy-mcp"
version = "0.1.0"
description = "MCP server for Fizzy — the Kanban tool by 37signals"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Alex Roubinet", email = "alex@clintagency.com" },
]
keywords = ["mcp", "fizzy", "kanban", "37signals", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
fizzy-mcp = "fizzy_mcp.server:main"

[project.urls]
Homepage = "https://github.com/alexroubinet/fizzy-mcp"
Repository = "https://github.com/alexroubinet/fizzy-mcp"
Issues = "https://github.com/alexroubinet/fizzy-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
